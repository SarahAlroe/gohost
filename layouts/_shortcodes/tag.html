{{ $tag := .Get 0 }}
{{ $tagPath := ""}}

{{ range .Site.Taxonomies.tags }}
    {{if eq $tag .Page.Title }}
        {{$tagPath = .Page.Permalink}}
    {{end}}
{{ end }}

{{if $tagPath}}
    <a href="{{ $tagPath }}" class="tag">#{{$tag}}</a>
{{else}}
    {{warnf "The tag \"%s\" does not appear to exist. Skipping." $tag}}
{{end}}
