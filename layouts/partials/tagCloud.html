<header>{{T "tags"}}</header>
<ul class="tags">
    {{ with .GetTerms "tags" }}
        {{ range . }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
    {{ else with (partial "tagAccumulator.html" . ) }}
        {{ range . }}
        <li><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
        {{ end }}
    {{ end }}
</ul>
